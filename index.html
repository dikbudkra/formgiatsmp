<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Pendaftaran Kegiatan - Bidang SMP DISDIKBUD Karanganyar</title>
  
  <!-- Favicon & Fonts -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Iframe Pembungkus Google Apps Script Web App */
    #gas-frame {
      width: 100%;
      flex-grow: 1;
      border: none;
      display: block;
      background-color: #f8fafc;
      transition: opacity 0.3s ease;
    }

    /* =========================================================================
       SPLASH SCREEN RESMI (ANIMASI LOGO KARANGANYAR)
       Muncul instan dalam 0.1 detik dari CDN GitHub Pages
       ========================================================================= */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F1F5F9 100%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      user-select: none;
    }

    /* Transisi Menghilang Halus (Fade Out) */
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Lingkaran Cahaya Oranye yang Berdenyut */
    .splash-logo-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.35) 0%, rgba(234, 88, 12, 0) 70%);
      border-radius: 50%;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    /* Gambar Logo Karanganyar Bergerak Mengapung Naik-Turun */
    .splash-logo {
      width: 96px;
      height: auto;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.12));
      animation: floatSoft 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 0.9; }
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .splash-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e293b;
      margin-bottom: 2px;
    }

    .splash-subtitle {
      font-size: 0.76rem;
      font-weight: 700;
      color: #ea580c;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0;
    }

    .splash-loading-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
    }

    .splash-ping-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f97316;
      animation: splashPing 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes splashPing {
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* =========================================================================
       STICKY PERSISTENT FOOTER (TUNGGAL DI BAWAH LAYAR)
       ========================================================================= */
    .sticky-app-footer {
      width: 100%;
      flex-shrink: 0;
      z-index: 1040;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1.5px solid rgba(234, 88, 12, 0.5);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
      padding: 10px 16px;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      user-select: none;
    }

    .sticky-app-footer .footer-text {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .sticky-app-footer .footer-logo {
      height: 28px;
      max-height: 32px;
      width: auto;
      object-fit: contain;
      vertical-align: middle;
      filter: brightness(4) contrast(1.5) saturate(1.5) drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .sticky-app-footer .footer-logo:hover {
      transform: scale(1.08);
    }

    .sticky-app-footer .footer-badge {
      color: #f97316;
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 576px) {
      .sticky-app-footer {
        padding: 8px 12px;
        gap: 8px;
      }
      .sticky-app-footer .footer-text {
        font-size: 0.76rem;
        letter-spacing: 0.04em;
      }
      .sticky-app-footer .footer-logo {
        height: 24px;
      }
      .sticky-app-footer .footer-badge {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================================
       SPLASH SCREEN (ANIMASI LOGO PEMBUKA - TAMPIL INSTAN 0.1 DETIK DARI GITHUB)
       ========================================================================= -->
  <div id="splash-screen">
    <div class="splash-logo-container">
      <!-- Efek Cahaya / Glow Berdenyut di Belakang Logo -->
      <div class="splash-logo-glow"></div>
      
      <!-- Gambar Logo (Bergerak Mengapung Naik-Turun) -->
      <img 
        src="https://lh3.googleusercontent.com/d/1e1LH5ZgYyLjclSNXwMAU5Zy_PKiju5z-" 
        alt="Logo Karanganyar" 
        class="splash-logo">
    </div>

    <div class="mt-4 text-center px-3" style="margin-top: 1.5rem; text-align: center;">
      <h2 class="splash-title">BIDANG SMP</h2>
      <p class="splash-subtitle">
        Dinas Pendidikan dan Kebudayaan Karanganyar
      </p>
      <div class="splash-loading-indicator">
        <span class="splash-ping-dot"></span>
        <span>Memuat aplikasi...</span>
      </div>
    </div>
  </div>

  <div id="app-container">
    <!-- Iframe Google Apps Script -->
    <iframe 
      id="gas-frame" 
      src="https://script.google.com/macros/s/AKfycbzuefL5VIGldvzfedGUgHpB-CSHAF3u0FX-xhiN_JIn79ahuQerE7dCSunD_u-xaQ_mUw/exec" 
      allow="clipboard-read; clipboard-write; camera; geolocation"
      onload="onFrameLoaded()">
    </iframe>

    <!-- Sticky Persistent Footer (Tunggal & Proporsional di Bawah) -->
    <footer class="sticky-app-footer">
      <span class="footer-text">DIGITALLY SHAPED BY</span>
      <img 
        src="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png" 
        alt="Logo JeMPROT" 
        class="footer-logo">
      <span class="footer-badge">[BID SMP 2026]</span>
    </footer>
  </div>

  <script>
    // URL Web App Google Apps Script Aktif:
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzmxJrWXpxU9qZrC_JTS5xRNjWtg8OPnwc6pCnGe5vi0vIfrx2E3Al8RmPfo3t_zlO2Qw/exec";

    // Set src iframe saat halaman dimuat (jika ada parameter query tambahan)
    const frame = document.getElementById("gas-frame");
    if (frame) {
      const currentQuery = window.location.search || "";
      if (currentQuery) {
        frame.src = DEFAULT_GAS_URL + currentQuery;
      }
    }

    // =========================================================================
    // KONTROL WAKTU SPLASH SCREEN (3.5 DETIK & TRANSISI FADE OUT HALUS)
    // =========================================================================
    let iframeReady = false;
    let minTimePassed = false;

    function triggerFadeOut() {
      const splash = document.getElementById("splash-screen");
      if (splash && !splash.classList.contains("fade-out")) {
        splash.classList.add("fade-out");
        setTimeout(() => {
          if (splash && splash.parentNode) {
            splash.remove();
          }
        }, 650);
      }
    }

    function checkDismissSplash() {
      // Hilang saat durasi 3.5 detik terpenuhi DAN iframe sudah selesai dimuat
      if (minTimePassed && iframeReady) {
        triggerFadeOut();
      }
    }

    // 1. Timer minimal tepat 3.5 detik
    setTimeout(() => {
      minTimePassed = true;
      checkDismissSplash();
    }, 3500);

    // 2. Event saat iframe selesai memuat halaman
    function onFrameLoaded() {
      iframeReady = true;
      checkDismissSplash();
    }

    // 3. Batas waktu pengaman maksimal (5 detik) agar tidak pernah macet
    setTimeout(() => {
      triggerFadeOut();
    }, 5000);

    // Sinkronisasi otomatis judul tab browser dengan kegiatan aktif
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "UPDATE_EVENT_TITLE" && event.data.title) {
        document.title = event.data.title + " - Bidang SMP DISDIKBUD Karanganyar";
      }
    });
  </script>
</body>
</html>
