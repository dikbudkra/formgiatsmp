<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Pendaftaran Kegiatan - Bidang SMP DISDIKBUD Karanganyar</title>
  
  <!-- Favicon & Fonts -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Iframe Pembungkus Google Apps Script Web App */
    #gas-frame {
      width: 100%;
      flex-grow: 1;
      border: none;
      display: block;
      background-color: #f8fafc;
      transition: opacity 0.3s ease;
    }

    /* Indikator Loading Awal */
    #loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #ffffff;
      z-index: 10;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =========================================================================
       STICKY PERSISTENT FOOTER (DISERAGAMKAN SAMA PERSIS DENGAN GAS)
       ========================================================================= */
    .sticky-app-footer {
      width: 100%;
      flex-shrink: 0;
      z-index: 1040;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1.5px solid rgba(234, 88, 12, 0.5);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
      padding: 10px 16px;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      user-select: none;
    }

    .sticky-app-footer .footer-text {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .sticky-app-footer .footer-logo {
      height: 28px;
      max-height: 32px;
      width: auto;
      object-fit: contain;
      vertical-align: middle;
      filter: brightness(4) contrast(1.5) saturate(1.5) drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .sticky-app-footer .footer-logo:hover {
      transform: scale(1.08);
    }

    .sticky-app-footer .footer-badge {
      color: #f97316;
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 576px) {
      .sticky-app-footer {
        padding: 8px 12px;
        gap: 8px;
      }
      .sticky-app-footer .footer-text {
        font-size: 0.76rem;
        letter-spacing: 0.04em;
      }
      .sticky-app-footer .footer-logo {
        height: 24px;
      }
      .sticky-app-footer .footer-badge {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Indikator Loading Saat Halaman Dibuka -->
    <div id="loading-spinner">
      <div class="spinner"></div>
      <span style="font-size: 0.88rem; font-weight: 600; letter-spacing: 0.03em;">Memuat Aplikasi Pendaftaran...</span>
    </div>

    <!-- Iframe Google Apps Script -->
    <!-- CATATAN: Pastikan URL di bawah ini mengarah ke Web App Google Apps Script Anda (akhiran /exec) -->
    <iframe 
      id="gas-frame" 
      src="" 
      allow="clipboard-read; clipboard-write; camera; geolocation"
      onload="onFrameLoaded()">
    </iframe>

    <!-- Sticky Persistent Footer (Ukuran Seragam & Proporsional) -->
    <footer class="sticky-app-footer">
      <span class="footer-text">DIGITALLY SHAPED BY</span>
      <img 
        src="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png" 
        alt="Logo JeMPROT" 
        class="footer-logo">
      <span class="footer-badge">[BID SMP 2026]</span>
    </footer>
  </div>

  <script>
    // URL Web App Google Apps Script Anda:
    // Jika URL Anda sebelumnya sudah ada, cukup masukkan kembali URL deployment GAS (/exec) Anda di sini.
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzZKFGKdtbgURoEPALy_whSw0xRCJAIru79wC9fIb1r-HOmMwRSLGnRiiZIxqW23Ogjqw/exec";

    // Set src iframe saat halaman dimuat
    const frame = document.getElementById("gas-frame");
    if (frame && (!frame.src || frame.src === window.location.href)) {
      // Jika di URL browser ada parameter query tambahan (misal ?v=...), teruskan ke iframe
      const currentQuery = window.location.search || "";
      frame.src = DEFAULT_GAS_URL + currentQuery;
    }

    function onFrameLoaded() {
      const spinner = document.getElementById("loading-spinner");
      if (spinner) {
        spinner.style.display = "none";
      }
    }

    // Dengarkan pesan sinkronisasi otomatis judul kegiatan dari aplikasi Google Apps Script
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "UPDATE_EVENT_TITLE" && event.data.title) {
        document.title = event.data.title + " - Bidang SMP DISDIKBUD Karanganyar";
      }
    });
  </script>
</body>
</html>
